<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professional of Badminton</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111111;
        --text: #f2f2f2;
        --text-secondary: #a6a6a6;
        --accent: #a8d5ba;
        --badge-border: #a6a6a6;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 100vh;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      a {
        color: var(--accent);
      }
      p {
        max-width: 320px;
        margin: 12px auto;
        line-height: 1.6;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin: 28px 0 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: 190px;
        height: 58px;
        padding: 0 14px;
        box-sizing: border-box;
        background: #000;
        color: #fff;
        border: 1px solid var(--badge-border);
        border-radius: 10px;
        text-decoration: none;
        text-align: start;
      }
      .badge:hover,
      .badge:focus-visible {
        border-color: #fff;
      }
      .badge svg {
        flex: none;
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
      .badge small {
        display: block;
        font-size: 11px;
        line-height: 1.2;
      }
      .badge strong {
        display: block;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.3px;
      }
      .lang-switch button {
        background: none;
        border: none;
        color: var(--text-secondary);
        font: inherit;
        cursor: pointer;
      }
      .lang-switch button[aria-current='true'] {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Professional of Badminton</h1>

      <div class="badges">
        <a
          class="badge"
          href="https://apps.apple.com/jo/app/professional-of-badminton/id6807263224"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.88 1.15 9.13.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.39-.92-2.39-3.65zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"
            />
          </svg>
          <span>
            <small data-i18n="iosTop">Download on the</small>
            <strong>App Store</strong>
          </span>
        </a>

        <a class="badge" href="professional-of-badminton.apk" download>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22A11.5 11.5 0 0 0 12 8.1c-1.78 0-3.46.38-4.92 1.04L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48C3.3 11.17 1.2 14.3.9 18h22.2c-.3-3.7-2.4-6.83-5.5-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"
            />
          </svg>
          <span>
            <small data-i18n="androidTop">Download for</small>
            <strong>Android</strong>
          </span>
        </a>
      </div>

      <p><a href="privacy-policy/" data-i18n="privacy">Privacy policy</a></p>
      <p><a href="delete-account/" data-i18n="delete">Delete your account</a></p>

      <p class="lang-switch">
        <button type="button" id="langEn" aria-current="true">English</button>
        ·
        <button type="button" id="langAr" aria-current="false">العربية</button>
      </p>
    </div>

    <script>
      (function () {
        var strings = {
          en: {
            iosTop: 'Download on the',
            androidTop: 'Download for',
            privacy: 'Privacy policy',
            delete: 'Delete your account',
          },
          ar: {
            iosTop: 'حمّله من',
            androidTop: 'حمّله لأجهزة',
            privacy: 'سياسة الخصوصية',
            delete: 'حذف حسابك',
          },
        };
        var btnEn = document.getElementById('langEn');
        var btnAr = document.getElementById('langAr');
        function show(lang) {
          var nodes = document.querySelectorAll('[data-i18n]');
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].textContent = strings[lang][nodes[i].getAttribute('data-i18n')];
          }
          btnEn.setAttribute('aria-current', String(lang === 'en'));
          btnAr.setAttribute('aria-current', String(lang === 'ar'));
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }
        btnEn.addEventListener('click', function () {
          show('en');
        });
        btnAr.addEventListener('click', function () {
          show('ar');
        });
        if ((navigator.language || '').slice(0, 2) === 'ar') show('ar');
      })();
    </script>
  </body>
</html>
